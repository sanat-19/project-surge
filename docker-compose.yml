services:
  surge-1:
    image: surge
    container_name: surgeP1
    cpuset: "0"
    build: 
      context: .
    expose:
      - "8080"

  surge-2:
    image: surge
    container_name: surgeP2
    cpuset: "1"
    build: 
      context: .
    expose:
      - "8080"

  surge-3:
    image: surge
    container_name: surgeP3
    cpuset: "2"
    build: 
      context: .
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    cpuset: "3"
    depends_on:
      - surge-1
      - surge-2
      - surge-3