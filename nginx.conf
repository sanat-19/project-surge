worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream surge_backend {
        server surgeP1:8080;
        server surgeP2:8080;
        server surgeP3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://surge_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}