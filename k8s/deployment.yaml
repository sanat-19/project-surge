apiVersion: apps/v1
kind: Deployment
metadata:
  name: surge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: surge
  template:
    metadata:
      labels:
        app: surge
    spec:
      containers:
        - name: surge-ctr
          image: surge:latest
          imagePullPolicy: Never
          env:
            - name: GOMAXPROCS
              value: "1"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 2
          resources:
            requests:
              cpu: 500m
            limits:
              cpu: 500m
