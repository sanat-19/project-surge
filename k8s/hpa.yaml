apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: surge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: surge
  minReplicas: 1
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
