worker_processes 2;

events {
    worker_connections 20000;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    # TCP Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    upstream surge_backend {
        least_conn;
        server surgeP1:8080;
        server surgeP2:8080;
        server surgeP3:8080;
        server surgeP4:8080;

        keepalive 2048;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://surge_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}